<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- iOS 전용(Play에는 09번이 없다). 2026-08-01: 단독 폰 → 2장 겹침으로 개편.
     좌석 도면 3테마 중 라운지 + 교실을 함께 보여 '테마가 여러 개'라는 걸 드러낸다 -->
<style>
  @font-face { font-family: 'P'; src: url('file:///C:/suneung-timer-native/assets/fonts/Pretendard-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'P'; src: url('file:///C:/suneung-timer-native/assets/fonts/Pretendard-Medium.ttf'); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1290px; height: 2796px; overflow: hidden; }
  body {
    font-family: 'P', sans-serif;
    background: linear-gradient(175deg, #EFEAFB 0%, #F7F5FC 45%, #E7E0F8 100%);
    display: flex; flex-direction: column; align-items: center; position: relative;
  }
  .brand { margin-top: 80px; background: #FFFFFF; color: #6C4DC4; font-size: 40px; font-weight: 700;
    padding: 16px 44px; border-radius: 999px; box-shadow: 0 6px 24px rgba(108,77,196,0.18); }
  h1 { margin-top: 48px; font-size: 122px; line-height: 1.2; letter-spacing: -3px;
    color: #241A47; text-align: center; font-weight: 700; }
  h1 .accent { color: #6C4DC4; }
  .sub { margin-top: 40px; font-size: 50px; font-weight: 500; color: #5B5477; text-align: center; line-height: 1.5; }
  .stage { position: relative; width: 1290px; flex: 1; }
  .phone { position: absolute; border-radius: 100px; background: #14112B; padding: 20px;
    box-shadow: 0 50px 140px rgba(40,25,100,0.38); }
  .screen { border-radius: 80px; overflow: hidden; background: #000; }
  .screen img { width: 100%; display: block; }
  /* 뒤: 교실 테마 좌석 (660*2.144 = 1415) */
  .p-class { right: 80px; top: 30px; transform: rotate(5deg); }
  .p-class .screen { width: 660px; height: 1415px; }
  /* 앞: 공개 라운지 좌석 (800*2.144 = 1715) */
  .p-lounge { left: 80px; top: 380px; transform: rotate(-4deg); }
  .p-lounge .screen { width: 800px; height: 1715px; }
  .badge {
    position: absolute; right: 120px; top: 1560px;
    background: #ED5E86; color: #fff; font-size: 42px; font-weight: 700;
    padding: 20px 46px; border-radius: 999px; box-shadow: 0 14px 40px rgba(237,94,134,0.4);
    transform: rotate(3deg);
  }
</style>
</head>
<body>
  <div class="brand">열공메이트</div>
  <h1>혼자여도 함께,<br><span class="accent">같이 공부해요</span></h1>
  <div class="sub">실시간 스터디룸에서 좌석에 앉아 함께 집중</div>
  <div class="stage">
    <div class="phone p-class"><div class="screen"><img src="file:///C:/suneung-timer-native/screenshots/cap-studyroom-class.png"></div></div>
    <div class="phone p-lounge"><div class="screen"><img src="file:///C:/suneung-timer-native/screenshots/cap-studyroom-lounge.png"></div></div>
    <div class="badge">실시간 스터디룸</div>
  </div>
</body>
</html>
